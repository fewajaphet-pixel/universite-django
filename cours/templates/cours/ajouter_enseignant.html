<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un enseignant</title>
    <link rel="stylesheet" href="{% static 'cours/styles.css' %}">
</head>
<body>
    <h1>Ajouter un enseignant</h1>
    
    <div class="navigation">
        <a href="{% url 'liste_enseignant' %}" class="btn">← Retour à la liste</a>
        <a href="{% url 'accueil' %}" class="btn">Accueil</a>
    </div>
    
    <div class="form-container">
        <form method="POST" class="teacher-form"> 
            {% csrf_token %} 
            
            {% if form.errors %}
                <div class="error-message">
                    <strong>Erreur :</strong> Veuillez corriger les erreurs ci-dessous.
                </div>
            {% endif %}
            
            {{ form.as_p }} 
            
            <div class="form-actions">
                <button type="submit" class="btn-submit">Ajouter l'enseignant</button>
                <a href="{% url 'liste_enseignant' %}" class="btn-cancel">Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
